<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT 品牌模块 · 设计预览</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #f5f5f7; }
    .preview { max-width: 780px; margin: 48px auto; padding: 0 24px; }
    .preview header { margin-bottom: 28px; }
    .preview h1 { margin: 8px 0; font-size: 28px; letter-spacing: -.8px; }
    .preview header p { margin: 0; color: #6e6e73; font-size: 14px; }
    .preview-label { color: #6e6e73; font-size: 12px; font-weight: 600; }
    .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
    .comparison h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: #6e6e73; }
    .comparison .proposed h2 { color: #0071e3; }
    .preview .link-card { background: #fff; padding: 18px; }
    .preview .card-heading h3 { margin-top: 0; }
    .preview .link-card > p { margin-top: 0; }
    .preview .card-top { gap: 10px; }
    .preview .app-icon { width: 44px; height: 44px; flex: 0 0 44px; }
    .preview .ranking-badge { font-size: 10px; padding: 0 7px; }
    .family-label { display: flex; justify-content: space-between; margin: 5px 0 8px; color: #6e6e73; font-size: 11px; }
    .family-label strong { color: #424245; font-weight: 600; }
    .child-product { display: block; padding: 12px; border: 1px solid #dce5ee; border-radius: 12px; background: #f5f9fd; transition: border-color 150ms ease, background 150ms ease; }
    .child-product:hover { border-color: #0071e3; background: #edf5fe; }
    .child-title { display: flex; align-items: center; gap: 9px; }
    .code-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: #1d1d1f; color: #fff; font: 600 14px ui-monospace, monospace; }
    .child-title strong { font-size: 15px; }
    .child-type { margin-left: auto; color: #6e6e73; font-size: 10px; }
    .preview .child-product p { margin: 9px 0; font-size: 12px; color: #424245; }
    .child-footer { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: #6e6e73; }
    .child-footer strong { color: #0071e3; font-weight: 600; white-space: nowrap; }
    .evidence-details { margin: 12px 0 4px; font-size: 11px; }
    .evidence-details summary { padding: 6px 0; color: #6e6e73; cursor: pointer; }
    .evidence-details[open] summary { margin-bottom: 6px; }
    .preview :focus-visible { outline: 3px solid #0071e3; outline-offset: 4px; }
    .preview-note { margin: 22px 0 0; font-size: 12px; color: #6e6e73; line-height: 1.7; }
    #copy-status { min-height: 22px; font-size: 12px; color: #167c35; }
    @media (max-width: 600px) {
      .preview { margin: 24px auto; padding: 0 16px; max-width: 390px; }
      .preview h1 { font-size: 24px; }
      .comparison { grid-template-columns: 1fr; gap: 24px; }
      .proposed { order: -1; }
    }
    @media (prefers-reduced-motion: reduce) { .child-product { transition: none; } }
  </style>
</head>
<body>
  <main class="preview">
    <header>
      <span class="preview-label">烤鸭笔记 / 设计试稿</span>
      <h1>同一品牌，放在一起。</h1>
      <p>以 ChatGPT 为主入口，在卡片内直接找到 Codex。</p>
    </header>
    <div class="comparison">
      <section><h2>当前布局</h2><div id="original"></div></section>
      <section class="proposed"><h2>品牌模块 · 新方案</h2><div id="proposed"></div></section>
    </div>
    <p class="preview-note">Codex 放在原推荐依据区域；推荐依据仍可展开查看。手机上优先展示新方案。内容沿用当前目录，本页仅测试排版。</p>
    <p id="copy-status" role="status" aria-live="polite"></p>
  </main>
  <script src="js/data.js"></script>
  <script>
    const parent = officialLinks.find(link => link.name === "ChatGPT");
    const child = officialLinks.find(link => link.name === "Codex");
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char]));
    const sourceMarkup = parent.sourceIds.map(id => {
      const source = id === 'official' ? { label: '产品官网', url: parent.url } : rankingSources[id];
      return `<a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.label)}</a>`;
    }).join("");
    const evidence = `<p class="ranking-note"><strong>推荐依据：</strong>${escapeHtml(parent.rankingNote)}</p><div class="ranking-evidence">${sourceMarkup}<span class="tag">核验于 ${escapeHtml(parent.verifiedAt)}</span></div>`;
    const nested = `<div class="family-label"><strong>编程 Agent</strong><span>OpenAI</span></div>
      <a class="child-product" href="${escapeHtml(child.url)}" target="_blank" rel="noopener noreferrer" aria-label="打开 Codex 官网（新标签页）">
        <div class="child-title"><span class="code-mark" aria-hidden="true">&gt;_</span><strong>${escapeHtml(child.name)}</strong><span class="child-type">${escapeHtml(child.useCase)}</span></div>
        <p>${escapeHtml(child.description)}</p>
        <div class="child-footer"><span>读代码 · 改文件 · 执行任务</span><strong>打开 Codex ↗</strong></div>
      </a>
      <details class="evidence-details"><summary>查看 ChatGPT 推荐依据</summary>${evidence}</details>`;
    for (const [id, content] of [["original", evidence], ["proposed", nested]]) {
      document.getElementById(id).innerHTML = `<article class="link-card">
        <div class="card-top"><span class="app-icon" aria-hidden="true"><img src="assets/icons/chatgpt.com.png" alt="" onerror="this.parentElement.classList.add('is-fallback'); this.remove()"><span class="app-icon-fallback">GPT</span></span>
          <div class="card-heading"><h3>${escapeHtml(parent.name)}</h3><span class="domain">chatgpt.com</span></div><span class="ranking-badge">能力推荐 #${parent.recommendationRank}</span></div>
        <p>${escapeHtml(parent.description)}</p>
        <dl class="ai-profile"><div><dt>优势</dt><dd>${escapeHtml(parent.strength)}</dd></div><div><dt>缺点</dt><dd>${escapeHtml(parent.weakness)}</dd></div></dl>
        <span class="best-for">${escapeHtml(parent.bestFor)}</span>${content}
        <div class="card-actions"><a class="open-link" href="${escapeHtml(parent.url)}" target="_blank" rel="noopener noreferrer">打开官网</a><button class="copy-button" type="button">复制链接</button></div>
      </article>`;
    }
    document.querySelectorAll('.copy-button').forEach(button => button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(parent.url);
        document.getElementById('copy-status').textContent = '已复制 ChatGPT 官网链接';
      } catch {
        document.getElementById('copy-status').textContent = `复制失败，请手动复制：${parent.url}`;
      }
    }));
  </script>
</body>
</html>
